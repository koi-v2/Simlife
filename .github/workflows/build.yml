name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Web Project Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Setup Capacitor and Android Platform
        run: |
          # Install Capacitor CLI and core libraries if not already installed
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

          # Initialize Capacitor if capacitor.config.json or capacitor.config.ts does not exist
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Lini Masa" "com.linimasa.app" --web-dir "dist"
          fi

          # Add Android platform if android folder doesn't exist yet
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Sync web assets to Android platform
          npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file was not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
